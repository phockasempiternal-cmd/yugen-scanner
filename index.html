
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yugen | Control de asistencia</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      background: #f5f5f5;
      color: #222;
    }
    h1 { text-align: center; }
    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #estado {
      margin: 16px 0;
      padding: 12px;
      background: white;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      border-radius: 8px;
    }
    #reader {
      width: 100%;
      background: white;
    }
  </style>
</head>
<body>
  <h1>Yugen Jiu-Jitsu</h1>
  <p>Control de asistencia mediante código QR.</p>

  <button id="iniciar">Activar cámara</button>
  <button id="detener" hidden>Detener cámara</button>

  <div id="estado">Pulsa «Activar cámara» para comenzar.</div>
  <div id="reader"></div>

  <script>
    const API_URL =
      "https://yugen-asistencia.phockasempiternal.workers.dev";

    let lector = null;
    let activo = false;
    let enviando = false;
    let ultimoToken = "";
    let ultimoMomento = 0;

    const estado = document.getElementById("estado");
    const iniciar = document.getElementById("iniciar");
    const detener = document.getElementById("detener");

    async function registrarQR(texto) {
      const token = texto.trim();
      const ahora = Date.now();

      // Evita enviar repetidamente el mismo QR al mantenerlo en cámara.
      if (enviando ||
          (token === ultimoToken && ahora - ultimoMomento < 5000)) {
        return;
      }

      ultimoToken = token;
      ultimoMomento = ahora;
      enviando = true;
      estado.textContent = "QR detectado. Registrando asistencia...";

      try {
        const respuesta = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=UTF-8"
          },
          body: JSON.stringify({
            accion: "registrarAsistencia",
            token: token
          })
        });

        const datos = await respuesta.json();

        if (!respuesta.ok || datos.ok !== true) {
          throw new Error(
            datos.mensaje || "El servidor no pudo registrar la asistencia."
          );
        }

        estado.textContent =
          "✅ ¡Asistencia registrada!\n" +
          (datos.nombre || datos.alumno || "") +
          (datos.mensaje ? "\n" + datos.mensaje : "");
      } catch (error) {
        console.error(error);
        estado.textContent =
          "No se pudo confirmar el registro.\n" +
          (error.message || String(error)) +
          "\nPuedes volver a intentar escanear el QR.";
        // Permite reintentar después de un error.
        ultimoToken = "";
      } finally {
        enviando = false;
      }
    }

    iniciar.addEventListener("click", async () => {
      iniciar.disabled = true;
      estado.textContent = "Solicitando permiso de cámara...";

      try {
        if (!window.isSecureContext) {
          throw new Error("La página debe abrirse mediante HTTPS.");
        }

        if (typeof Html5Qrcode === "undefined") {
          throw new Error("No se pudo cargar el lector QR.");
        }

        if (!lector) {
          lector = new Html5Qrcode("reader");
        }

        await lector.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 230, height: 230 }
          },
          (texto) => registrarQR(texto),
          () => {}
        );

        activo = true;
        iniciar.hidden = true;
        detener.hidden = false;
        estado.textContent = "Cámara activa. Apunta al QR de un alumno.";
      } catch (error) {
        console.error(error);
        estado.textContent = "Error: " + (error.message || String(error));
      } finally {
        iniciar.disabled = false;
      }
    });

    detener.addEventListener("click", async () => {
      if (lector && activo) {
        await lector.stop();
        activo = false;
      }
      detener.hidden = true;
      iniciar.hidden = false;
      estado.textContent = "Cámara detenida.";
    });
  </script>
</body>
</html>
